name: AnimalAct final integrated Linux CPU validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/restore.py all
      - run: python -m unittest tests.test_portable tests.test_i18n tests.test_proposal tests.test_action_detection tests.test_boundary_grounding tests.test_final_deployment tests.test_bonus_grounding -v
        env:
          RUN_MODEL_SMOKE: '1'
          RUN_FINAL_SMOKE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
