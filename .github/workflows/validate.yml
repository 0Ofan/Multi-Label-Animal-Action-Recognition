name: AnimalAct 2.0 Linux CPU validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/restore.py runtime
      - run: python -m unittest tests.test_portable -v
        env:
          RUN_MODEL_SMOKE: '1'
